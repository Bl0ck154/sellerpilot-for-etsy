<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Etsy Messages Mock</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; color: #222; }
        header { height: 64px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid #ddd; }
        .wt-grid { display: grid; grid-template-columns: 220px 1fr 220px; min-height: calc(100vh - 65px); }
        .wt-grid > div { padding: 16px; border-right: 1px solid #ddd; }
        .detail-view { display: flex; flex-direction: column; }
        .msg-list-container { flex: 1; }
        .inline-compose-container { padding-top: 12px; }
        textarea { width: 100%; min-height: 90px; box-sizing: border-box; padding: 12px; }
        button[aria-label="Send"] { float: right; margin-top: 8px; padding: 8px 20px; }
    </style>
</head>
<body>
    <header>Mock Etsy Messages</header>
    <main class="wt-grid wt-overflow-hidden wt-bt-xs wt-width-full">
        <div class="wt-grid__item-lg-2">Conversations</div>
        <div class="detail-view">
            <div class="msg-list-container">
                <p><strong>Customer:</strong> Hello, can you help me?</p>
            </div>
            <form class="inline-compose-container">
                <textarea class="wt-textarea" aria-label="Message"></textarea>
                <button type="button" data-clg-id="WtButton" aria-label="Send">Send</button>
            </form>
        </div>
        <div class="wt-grid__item-lg-3">Order details</div>
    </main>
    <script>
        window.mockSendCount = 0;
        document.querySelector('[aria-label="Send"]').addEventListener('click', () => {
            window.mockSendCount += 1;
            document.querySelector('textarea').value = '';
        });
    </script>
</body>
</html>
