name: Bug report
description: Report a reproducible problem in SellerPilot for Etsy
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove API keys, Etsy customer data, order details, private screenshots, cookies, and account identifiers before submitting.

  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "1.6.26"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Chromium
        - Microsoft Edge
        - Firefox
        - Other
    validations:
      required: true

  - type: input
    id: browser_version
    attributes:
      label: Browser version
      placeholder: "e.g. Chrome 140"

  - type: dropdown
    id: page_type
    attributes:
      label: Etsy page / workflow
      options:
        - Messages / conversation
        - Listings
        - Listing editor
        - Shop dashboard
        - Public listing
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: Tell us what you saw and what you expected.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Send ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized console output
      description: Optional. Paste only output that has been checked for customer data, tokens, URLs with private identifiers, and credentials.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, customer data, account identifiers, cookies, and private screenshots from this report.
          required: true
