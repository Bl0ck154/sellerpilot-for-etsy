name: Chrome Web Store Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after upload
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build extension
        shell: cmd
        run: build.bat

      - name: Package Chrome/Edge build
        shell: powershell
        run: |
          Compress-Archive -Path "dist/chrome/*" -DestinationPath "etsy-ai-assistant-chrome.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: etsy-ai-assistant-chrome
          path: etsy-ai-assistant-chrome.zip

      - name: Upload to Chrome Web Store
        shell: powershell
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          $tokenResponse = Invoke-RestMethod -Method Post -Uri "https://oauth2.googleapis.com/token" -Body @{
            client_id = $env:CHROME_CLIENT_ID
            client_secret = $env:CHROME_CLIENT_SECRET
            refresh_token = $env:CHROME_REFRESH_TOKEN
            grant_type = "refresh_token"
          }

          Invoke-RestMethod `
            -Method Put `
            -Uri "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$env:CHROME_EXTENSION_ID" `
            -Headers @{ Authorization = "Bearer $($tokenResponse.access_token)"; "x-goog-api-version" = "2" } `
            -ContentType "application/zip" `
            -InFile "etsy-ai-assistant-chrome.zip"

      - name: Publish Chrome Web Store item
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == 'true' }}
        shell: powershell
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          $tokenResponse = Invoke-RestMethod -Method Post -Uri "https://oauth2.googleapis.com/token" -Body @{
            client_id = $env:CHROME_CLIENT_ID
            client_secret = $env:CHROME_CLIENT_SECRET
            refresh_token = $env:CHROME_REFRESH_TOKEN
            grant_type = "refresh_token"
          }

          Invoke-RestMethod `
            -Method Post `
            -Uri "https://www.googleapis.com/chromewebstore/v1.1/items/$env:CHROME_EXTENSION_ID/publish" `
            -Headers @{ Authorization = "Bearer $($tokenResponse.access_token)"; "x-goog-api-version" = "2" }
