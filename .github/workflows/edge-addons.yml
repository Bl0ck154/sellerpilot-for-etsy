name: Microsoft Edge Add-ons Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after package upload
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      previous_store_version:
        description: Version currently published in Edge (for cumulative certification notes)
        required: false
        default: ""
      permission_justifications_confirmed:
        description: Confirm Partner Center permission-justification fields were updated if new permissions are detected
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      notes:
        description: Additional reviewer notes (cumulative notes are generated automatically)
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  release-edge:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Node regression tests
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tests = Get-ChildItem -Path "tests" -Filter "*.test.js" | Sort-Object Name
          foreach ($test in $tests) {
            Write-Host "Running $($test.Name)"
            & node $test.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Test failed: $($test.Name)"
            }
          }

      - name: Generate cumulative Edge certification notes
        id: cert_notes
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == 'true' }}
        shell: powershell
        env:
          INPUT_PREVIOUS_STORE_VERSION: ${{ inputs.previous_store_version }}
          FALLBACK_PREVIOUS_STORE_VERSION: ${{ vars.EDGE_PREVIOUS_STORE_VERSION }}
          ADDITIONAL_NOTES: ${{ inputs.notes }}
        run: |
          $ErrorActionPreference = "Stop"
          $previousVersion = $env:INPUT_PREVIOUS_STORE_VERSION
          if (-not $previousVersion) {
            $previousVersion = $env:FALLBACK_PREVIOUS_STORE_VERSION
          }
          if (-not $previousVersion) {
            throw "Publishing requires previous_store_version (or repository variable EDGE_PREVIOUS_STORE_VERSION) so certification notes cover every change since the version actually published in Edge."
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "edge-certification-notes.txt"
          & .\scripts\generate-edge-certification-notes.ps1 `
            -PreviousStoreVersion $previousVersion `
            -OutputPath $notesPath `
            -AdditionalNotes $env:ADDITIONAL_NOTES

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to generate Edge certification notes."
          }

          "notes_path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "previous_store_version=$previousVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Edge certification notes"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```text'
          Get-Content $notesPath | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'

      - name: Require Partner Center permission-justification confirmation
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish == 'true') && steps.cert_notes.outputs.has_permission_additions == 'true' }}
        shell: powershell
        env:
          JUSTIFICATIONS_CONFIRMED: ${{ inputs.permission_justifications_confirmed }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:JUSTIFICATIONS_CONFIRMED -ne "true") {
            throw "New manifest permissions/hosts were detected. Before publishing, update the formal Permission justification fields in Microsoft Partner Center from .github/edge-permission-justifications.json, then re-run with permission_justifications_confirmed=true. The Edge submission API cannot update those formal fields."
          }

      - name: Build Chromium package
        shell: cmd
        run: build.bat

      - name: Package Chrome/Edge build
        shell: powershell
        run: |
          Compress-Archive -Path "dist/chrome/*" -DestinationPath "etsy-ai-assistant-edge.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: etsy-ai-assistant-edge
          path: etsy-ai-assistant-edge.zip

      - name: Upload certification notes artifact
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: edge-certification-notes
          path: ${{ runner.temp }}/edge-certification-notes.txt

      - name: Upload package to Edge Add-ons
        id: edge_upload
        shell: powershell
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $uploadUri = "https://api.addons.microsoftedge.microsoft.com/v1/products/$env:EDGE_PRODUCT_ID/submissions/draft/package"
          $headersPath = Join-Path $env:RUNNER_TEMP "edge-upload-headers.txt"

          & curl.exe `
            -sS `
            -D $headersPath `
            -o "$env:RUNNER_TEMP\edge-upload-body.json" `
            -w "%{http_code}" `
            -H "Authorization: ApiKey $env:EDGE_API_KEY" `
            -H "X-ClientID: $env:EDGE_CLIENT_ID" `
            -H "Content-Type: application/zip" `
            -X POST `
            -T "etsy-ai-assistant-edge.zip" `
            $uploadUri | Tee-Object -Variable statusCode

          if ($statusCode -ne "202") {
            $body = Get-Content "$env:RUNNER_TEMP\edge-upload-body.json" -Raw -ErrorAction SilentlyContinue
            throw "Edge upload failed with status $statusCode. Body: $body"
          }

          $operationId = (Get-Content $headersPath | Where-Object { $_ -match '^Location:' } | Select-Object -First 1) -replace '^Location:\s*', ''
          $operationId = $operationId.Trim()
          if (-not $operationId) {
            throw "Edge upload did not return an operation Location header"
          }

          "operation_id=$operationId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Wait for Edge package processing
        shell: powershell
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_OPERATION_ID: ${{ steps.edge_upload.outputs.operation_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Authorization = "ApiKey $env:EDGE_API_KEY"
            "X-ClientID" = $env:EDGE_CLIENT_ID
          }

          $statusUri = "https://api.addons.microsoftedge.microsoft.com/v1/products/$env:EDGE_PRODUCT_ID/submissions/draft/package/operations/$env:EDGE_OPERATION_ID"

          for ($i = 1; $i -le 30; $i++) {
            $response = Invoke-RestMethod -Method Get -Uri $statusUri -Headers $headers
            $status = $response.status
            Write-Host "Edge upload status: $status"

            if ($status -in @("Succeeded", "Success", "Completed")) { exit 0 }
            if ($status -in @("Failed", "Failure")) { throw "Edge upload processing failed: $($response | ConvertTo-Json -Depth 10)" }

            Start-Sleep -Seconds 10
          }

          throw "Timed out waiting for Edge upload processing"

      - name: Publish Edge Add-ons draft
        id: edge_publish
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == 'true' }}
        shell: powershell
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_NOTES_PATH: ${{ steps.cert_notes.outputs.notes_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:EDGE_NOTES_PATH -or -not (Test-Path $env:EDGE_NOTES_PATH)) {
            throw "Certification notes were not generated. Refusing to publish."
          }

          $notes = Get-Content $env:EDGE_NOTES_PATH -Raw
          if ([string]::IsNullOrWhiteSpace($notes) -or $notes.Length -lt 200) {
            throw "Certification notes are unexpectedly short. Refusing to publish a low-information submission."
          }

          $bodyPath = Join-Path $env:RUNNER_TEMP "edge-publish-notes.json"
          @{ notes = $notes } | ConvertTo-Json | Out-File -FilePath $bodyPath -Encoding utf8
          $publishUri = "https://api.addons.microsoftedge.microsoft.com/v1/products/$env:EDGE_PRODUCT_ID/submissions"
          $headersPath = Join-Path $env:RUNNER_TEMP "edge-publish-headers.txt"

          & curl.exe `
            -sS `
            -D $headersPath `
            -o "$env:RUNNER_TEMP\edge-publish-body.json" `
            -w "%{http_code}" `
            -H "Authorization: ApiKey $env:EDGE_API_KEY" `
            -H "X-ClientID: $env:EDGE_CLIENT_ID" `
            -H "Content-Type: application/json" `
            -X POST `
            --data-binary "@$bodyPath" `
            $publishUri | Tee-Object -Variable statusCode

          if ($statusCode -ne "202") {
            $body = Get-Content "$env:RUNNER_TEMP\edge-publish-body.json" -Raw -ErrorAction SilentlyContinue
            throw "Edge publish failed with status $statusCode. Body: $body"
          }

          $operationId = (Get-Content $headersPath | Where-Object { $_ -match '^Location:' } | Select-Object -First 1) -replace '^Location:\s*', ''
          $operationId = $operationId.Trim()
          if (-not $operationId) {
            throw "Edge publish did not return an operation Location header"
          }

          "operation_id=$operationId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Wait for Edge publish processing
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == 'true' }}
        shell: powershell
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_OPERATION_ID: ${{ steps.edge_publish.outputs.operation_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Authorization = "ApiKey $env:EDGE_API_KEY"
            "X-ClientID" = $env:EDGE_CLIENT_ID
          }

          $statusUri = "https://api.addons.microsoftedge.microsoft.com/v1/products/$env:EDGE_PRODUCT_ID/submissions/operations/$env:EDGE_OPERATION_ID"

          for ($i = 1; $i -le 30; $i++) {
            $response = Invoke-RestMethod -Method Get -Uri $statusUri -Headers $headers
            $status = $response.status
            Write-Host "Edge publish status: $status"

            if ($status -in @("Succeeded", "Success", "Completed")) { exit 0 }
            if ($status -in @("Failed", "Failure")) { throw "Edge publish processing failed: $($response | ConvertTo-Json -Depth 10)" }

            Start-Sleep -Seconds 10
          }

          throw "Timed out waiting for Edge publish processing"
